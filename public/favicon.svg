<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Christmas Gift</title>
  <!-- Fondo: el casi negro de la app -->
  <rect width="64" height="64" rx="14" fill="#0d0f14"/>
  <!-- Moño: dos lazos dorados -->
  <path d="M32 22 C27 11 15 11 17.5 18.5 C19 22.5 26 23 32 22 Z" fill="#f2c867"/>
  <path d="M32 22 C37 11 49 11 46.5 18.5 C45 22.5 38 23 32 22 Z" fill="#e0ad3e"/>
  <!-- Caja: lado iluminado y lado en sombra -->
  <rect x="14" y="31" width="36" height="23" rx="2" fill="#c42532"/>
  <rect x="32" y="31" width="18" height="23" rx="2" fill="#a51d2a"/>
  <!-- Tapa, un poco más ancha -->
  <rect x="11" y="22" width="42" height="10" rx="2" fill="#e8323f"/>
  <rect x="32" y="22" width="21" height="10" rx="2" fill="#c42532"/>
  <!-- Cinta vertical y nudo -->
  <rect x="28.5" y="22" width="7" height="32" fill="#f2c867"/>
  <rect x="32" y="22" width="3.5" height="32" fill="#e0ad3e"/>
  <circle cx="32" cy="22" r="3.4" fill="#f7d98a"/>
</svg>
